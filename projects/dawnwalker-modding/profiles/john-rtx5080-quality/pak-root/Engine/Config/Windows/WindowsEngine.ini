; John RTX 5080 Quality + Smoothness profile for The Blood of Dawnwalker.
; Target: RTX 5080 16 GB, Ryzen 9 5900X, 32 GB RAM, 3840x2160.
; Inspired by the configuration-based approach used by VynnGfx's
; "Optimized Tweaks TBOD". This is an independently tuned configuration.
;
; Deliberately not overridden here:
; resolution, screen percentage, DLSS, frame generation, VSync, frame cap,
; Lumen quality, ray tracing, shadows, foliage, post-processing, or VRS.

[TextureStreaming]
; Leave enough headroom for Lumen, Nanite, frame generation, and render targets.
PoolSizeVRAMPercentage=55
MemoryMargin=512

[SystemSettings]
; Texture streaming: favor stable 4K traversal without consuming all VRAM.
r.Streaming.PoolSize=8192
r.Streaming.UseFixedPoolSize=1
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MaxTempMemoryAllowed=512
r.Streaming.DefragDynamicBounds=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MinMipForSplitRequest=1
r.Streaming.UseMaterialData=1

; Nanite: reduce geometry cache churn while retaining several GB of GPU headroom.
r.Nanite.Streaming.StreamingPoolSize=2048
r.Nanite.Streaming.DynamicallyGrowAllocations=1
r.Nanite.Streaming.MaxPageInstallsPerFrame=128

; PSO and shader caching: spend spare CPU/RAM to reduce first-use shader hitches.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.GlobalShaders=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.ShaderPipelineCache.Enabled=1
D3D12.PSO.DiskCache=1
D3D12.PSO.DriverOptimizedDiskCache=1

; Asynchronous loading sized for a 12-core/24-thread CPU and 32 GB system RAM.
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1
s.ProcessPrestreamingRequests=1
s.IoDispatcherBufferMemoryMB=64
s.IoDispatcherCacheSizeMB=512
s.IoDispatcherDecompressionWorkerCount=6
s.MaxLevelRequestsAtOnceWhileInMatch=4
s.MaxPrecacheRequestsInFlight=8

; Parallel work. Let Unreal choose its full task graph instead of capping it at 4.
r.AsyncPipelineCompile=1
r.ForceAllCoresForShaderCompiling=1
a.ForceParallelAnimUpdate=1
GeometryCache.OffloadUpdate=1
r.DistanceFields.ParallelUpdate=1
fx.AllowFastPathFunctionLibrary=1
FX.BatchAsync=1
FX.EarlyScheduleAsync=1

; D3D12 stability and scheduling. Keep crash diagnostics at game defaults.
D3D12.ResidencyManagement=1
D3D12.StablePowerState=0
r.RHICmdBypass=0
r.RHICmdUseThread=1

[/Script/Engine.InputSettings]
bEnableMouseSmoothing=False
bEnableMouseAcceleration=False

[/Script/Engine.Engine]
bAllowMultiThreadedShaderCompile=True
bSmoothFrameRate=False

[/Script/AkAudio.AkSettings]
bEnableMultiCoreRendering=True
